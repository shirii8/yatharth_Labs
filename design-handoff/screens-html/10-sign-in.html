<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language and sign in</title>
<link rel="stylesheet" href="../fonts/fonts.css">


<style>
body{margin:0}
</style>

</head>
<body>


<div lang="en" style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans Telugu', 'Noto Sans Devanagari', system-ui, sans-serif; font-size: 19px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grM"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grM)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbM"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 12px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; letter-spacing: 0.04em; font-variant: small-caps">[Lab name]</span>
<button aria-label="Change text size" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px; cursor: pointer">Aa</button>
</header>

<div role="tablist" aria-label="Language" style="position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 10px; margin-bottom: -2.5px">

<button role="tab" aria-selected="true" lang="en" style="flex: 1; min-height: 54px; margin-top: 0; padding: 4px 6px; border: 2.5px solid #161513; border-bottom-color: #FAF6EE; border-radius: 12px 12px 0 0; background: #FAF6EE; color: #161513; font-family: 'Atkinson Hyperlegible Next', sans-serif; font-size: 17px; font-weight: 700; line-height: 1.4; cursor: pointer">English</button>

<button role="tab" aria-selected="false" lang="te" style="flex: 1; min-height: 54px; margin-top: 8px; padding: 4px 6px; border: 2.5px solid #161513; border-bottom-color: #161513; border-radius: 12px 12px 0 0; background: #F1D9DC; color: #161513; font-family: 'Noto Sans Telugu', sans-serif; font-size: 17px; font-weight: 700; line-height: 1.4; cursor: pointer">తెలుగు</button>

<button role="tab" aria-selected="false" lang="hi" style="flex: 1; min-height: 54px; margin-top: 8px; padding: 4px 6px; border: 2.5px solid #161513; border-bottom-color: #161513; border-radius: 12px 12px 0 0; background: #F4E9C6; color: #161513; font-family: 'Noto Sans Devanagari', sans-serif; font-size: 17px; font-weight: 700; line-height: 1.4; cursor: pointer">हिन्दी</button>

</div>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 30px 24px 26px; background: #FAF6EE; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #FAF6EE, inset 0 0 0 7.5px #161513">
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', 'Noto Serif Devanagari', Georgia, serif; font-weight: 500; font-size: 58px; line-height: 1; letter-spacing: -0.02em">Your file at the lab.</h1>
<p style="margin: -8px 0 0; font-family: 'Newsreader', 'Noto Serif Telugu', 'Noto Serif Devanagari', Georgia, serif; font-size: 1.2em; line-height: 1.3; font-style: italic">Every report we make for you is kept here, page by page.</p>

<svg aria-hidden="true" width="100%" height="14" viewBox="0 0 330 14" preserveAspectRatio="none"><path d="M1 12H150Q154 12 156 3H184Q186 12 190 12H329" fill="none" stroke="#161513" stroke-width="1.6" stroke-linecap="round" filter="url(#wbM)"></path></svg>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="phM" style="font-weight: 700">Your mobile number</label>
<div style="display: flex; min-height: 62px; border: 2.5px solid #161513; border-radius: 12px; overflow: hidden; background: #FFFDF7">
<span style="display: flex; align-items: center; padding: 0 14px; border-right: 1.5px solid #161513; font-weight: 700">+91</span>
<input id="phM" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit number" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #161513; padding: 0 14px; font-family: inherit; font-size: 1.05em; letter-spacing: 0.04em; outline: none">
</div>
<span style="font-size: 0.8em; color: #3A3631">The one you gave at the lab counter.</span>
</div>

<a href="Otp.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700; line-height: 1.3">Send me a code<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>

<div style="margin-top: auto; display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: end">
<svg aria-hidden="true" width="92" height="76" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbM)"><path d="M10 30h34l6-10h28l6 10h26v58H10z"></path><path d="M10 44h100"></path><path d="M26 30V14h56" stroke="#0F5A43"></path></g></svg>
<span style="font-size: 0.8em">No password to remember. Only this number opens your file, and we write down every time it is opened.</span>
</div>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 6px 8px; box-sizing: border-box; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px; line-height: 1.3; text-align: center">Call the lab</a>
<button style="min-height: 56px; padding: 6px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px; line-height: 1.3">Call me back</button>
</footer>
</div>

</body>
</html>
