<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something looks wrong</title>
<link rel="stylesheet" href="../fonts/fonts.css">


<style>
body{margin:0}
</style>

</head>
<body>


<div lang="en" style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans Telugu', system-ui, sans-serif; font-size: 20px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grF"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grF)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbF"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<a href="Report.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 50px; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>Cancel</a>
<span style="font-size: 16px">Blood count</span>
</header>

<ol aria-label="Steps" style="position: relative; z-index: 2; display: flex; gap: 4px; margin: 0 0 -2.5px; padding: 0 8px; list-style: none">

<li aria-current="false" style="flex: 1; min-height: 48px; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; border: 2.5px solid #161513; border-bottom-color: #161513; border-radius: 12px 12px 0 0; background: #D7E3EE; font-family: 'Newsreader', Georgia, serif; font-size: 21px">✓ 1</li>

<li aria-current="step" style="flex: 1; min-height: 56px; margin-top: 0; display: flex; align-items: center; justify-content: center; gap: 4px; border: 2.5px solid #161513; border-bottom-color: #FAF6EE; border-radius: 12px 12px 0 0; background: #FAF6EE; font-family: 'Newsreader', Georgia, serif; font-size: 21px">2</li>

<li aria-current="false" style="flex: 1; min-height: 48px; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; border: 2.5px solid #161513; border-bottom-color: #161513; border-radius: 12px 12px 0 0; background: #F4E9C6; font-family: 'Newsreader', Georgia, serif; font-size: 21px">3</li>

</ol>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 30px 22px 26px; background: #FAF6EE; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #FAF6EE, inset 0 0 0 7.5px #161513">




<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-weight: 500; font-size: 48px; line-height: 1; letter-spacing: -0.02em">Tell us a little more.</h1>
<p style="margin: 0; padding: 10px 0; border-top: 2.5px solid #161513; border-bottom: 1px solid #B9B2A5; font-size: 0.88em"><span>You picked:</span> <strong>A value looks different from what I expected</strong></p>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 700">Anything that would help us check<span style="font-weight: 400; font-size: 0.82em">You can skip this.</span>
<textarea rows="4" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 10px; border: 2.5px solid #161513; background: #FFFDF7; color: #161513; font-family: inherit; font-size: 0.95em; line-height: 1.5">My haemoglobin was 12.4 at another lab last month.</textarea>
</label>
<p style="margin: 0; font-size: 0.88em">We will ring you back on •3210.</p>
<div style="display: grid; grid-template-columns: 1fr 1.7fr; gap: 8px">
<button style="min-height: 60px; padding: 6px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-size: 0.88em; font-weight: 700; line-height: 1.3; cursor: pointer">Back</button>
<button style="min-height: 60px; padding: 6px 8px; border-radius: 12px; border: 0; background: #0F5A43; color: #FAF6EE; font-family: inherit; font-size: 0.88em; font-weight: 700; line-height: 1.3; cursor: pointer">Send it to the lab</button>
</div>
</div>



</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 4px 8px; box-sizing: border-box; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px; line-height: 1.3; text-align: center">Call the lab</a>
<button style="min-height: 56px; padding: 4px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px; line-height: 1.3">Call me back</button>
</footer>
</div>

</body>
</html>
