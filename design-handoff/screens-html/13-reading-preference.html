<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading preference</title>
<link rel="stylesheet" href="../fonts/fonts.css">


<style>
body{margin:0}
</style>

</head>
<body>


<div style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 19px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grP"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grP)"></rect></svg>

<header style="position: relative; padding: 12px 4px 6px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-variant: small-caps; letter-spacing: 0.04em">[Lab name]</span>
<h1 style="margin: 10px 0 14px; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -0.02em">How would you like to read?</h1>
</header>

<div role="tablist" aria-label="Reading style" style="position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 10px; margin-bottom: -2.5px">

<button role="tab" aria-selected="true" style="flex: 1; min-height: 58px; margin-top: 0; border: 2.5px solid #161513; border-bottom-color: #FAF6EE; border-radius: 12px 12px 0 0; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 22px; cursor: pointer">Simple</button>

<button role="tab" aria-selected="false" style="flex: 1; min-height: 50px; margin-top: 8px; border: 2.5px solid #161513; border-bottom-color: #161513; border-radius: 12px 12px 0 0; background: #DCE7D6; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 22px; cursor: pointer">Compact</button>

</div>

<main role="tabpanel" style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 28px 22px 24px; background: #FAF6EE; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #FAF6EE, inset 0 0 0 7.5px #161513">

<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 1.05em">Big letters, one result at a time, and it can be read aloud to you.</p>
<div aria-hidden="true" style="padding: 18px; border: 1.5px dashed #161513; border-radius: 8px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase">Result 1 of 4</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 1">Haemoglobin</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 84px; line-height: 1; letter-spacing: -0.03em">10.2</span>
<svg width="100%" height="34" viewBox="0 0 280 34" preserveAspectRatio="none"><rect x="112" y="8" width="98" height="14" rx="7" fill="#DCE7D6" stroke="#161513" stroke-width="1.5"></rect><path d="M2 15Q70 13 140 15T278 14" fill="none" stroke="#161513" stroke-width="1.8"></path><path d="M50 15v6h22v-6" fill="#0F5A43" stroke="#0F5A43"></path></svg>
<span style="font-size: 17px"><strong style="color: #8A3B26">A little low.</strong> Next result →</span>
</div>
</div>


<a href="Who.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700">Read it the Simple way<span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<p style="margin: 0; font-size: 0.85em; color: #3A3631">Same words and results either way. Switch any time with the tabs at the top of a report.</p>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px">Call the lab</a>
<button style="min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px">Call me back</button>
</footer>
</div>

</body>
</html>
