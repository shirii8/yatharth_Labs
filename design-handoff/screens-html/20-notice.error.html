<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice</title>
<link rel="stylesheet" href="../fonts/fonts.css">


<style>
body{margin:0}
</style>

</head>
<body>


<div style="position: relative; width: 390px; min-height: 900px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 20px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grN"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grN)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbN"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.4"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-variant: small-caps; letter-spacing: 0.04em">[Lab name]</span>
<button aria-label="Change text size" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px">Aa</button>
</header>

<div style="position: relative; z-index: 2; display: flex; padding: 0 10px; margin-bottom: -2.5px">
<span style="min-height: 52px; padding: 0 18px; display: flex; align-items: center; border: 2.5px solid #161513; border-bottom-color: #F6E8E6; border-radius: 12px 12px 0 0; background: #F6E8E6; font-size: 15px; font-weight: 700">Lights out</span>
</div>

<main role="alert" style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 34px 22px 26px; background: #F6E8E6; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #F6E8E6, inset 0 0 0 7.5px #161513">
<svg aria-hidden="true" width="150" height="120" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbN)"><path d="M44 14h32l14 30H30zM60 44v30M46 88h28M52 74h16"></path><path d="M36 56l-8 6M84 56l8 6" stroke="#0F5A43" stroke-width="2.4"></path></g></svg>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.02em">Our lamp is out for a moment.</h1>
<p style="margin: 0">Your file is safe. Our side is slow right now. Please try again in a minute or two.</p>


<a href="Reports.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700">Try again<span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>


<p style="margin: auto 0 0; padding-top: 14px; border-top: 1px solid #161513; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 0.95em">If you call us, say code R-502 and we will know what happened.</p>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px">Call the lab</a>
<button style="min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px">Call me back</button>
</footer>
</div>

</body>
</html>
