<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language and sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Noto+Sans+Telugu:wght@400;600&amp;family=Noto+Serif+Telugu:wght@500&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Noto+Serif+Devanagari:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div lang="{{L.code}}" style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans Telugu', 'Noto Sans Devanagari', system-ui, sans-serif; font-size: {{fs}}px; line-height: {{lh}}; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grM"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grM)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbM"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 12px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; letter-spacing: 0.04em; font-variant: small-caps">[Lab name]</span>
<button onClick="{{toggleSize}}" aria-label="{{L.aa}}" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px; cursor: pointer">Aa</button>
</header>

<div role="tablist" aria-label="{{L.choose}}" style="position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 10px; margin-bottom: -2.5px">
<sc-for list="{{langs}}" as="g" hint-placeholder-count="3">
<button role="tab" aria-selected="{{g.sel}}" lang="{{g.code}}" onClick="{{g.pick}}" style="flex: 1; min-height: 54px; margin-top: {{g.mt}}; padding: 4px 6px; border: 2.5px solid #161513; border-bottom-color: {{g.bb}}; border-radius: 12px 12px 0 0; background: {{g.bg}}; color: #161513; font-family: {{g.font}}; font-size: 17px; font-weight: 700; line-height: 1.4; cursor: pointer">{{g.label}}</button>
</sc-for>
</div>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 30px 24px 26px; background: #FAF6EE; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #FAF6EE, inset 0 0 0 7.5px #161513">
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', 'Noto Serif Devanagari', Georgia, serif; font-weight: 500; font-size: {{bigSize}}; line-height: {{hlh}}; letter-spacing: -0.02em">{{L.big}}</h1>
<p style="margin: -8px 0 0; font-family: 'Newsreader', 'Noto Serif Telugu', 'Noto Serif Devanagari', Georgia, serif; font-size: 1.2em; line-height: 1.3; font-style: italic">{{L.sub}}</p>

<svg aria-hidden="true" width="100%" height="14" viewBox="0 0 330 14" preserveAspectRatio="none"><path d="M1 12H150Q154 12 156 3H184Q186 12 190 12H329" fill="none" stroke="#161513" stroke-width="1.6" stroke-linecap="round" filter="url(#wbM)"></path></svg>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="phM" style="font-weight: 700">{{L.label}}</label>
<div style="display: flex; min-height: 62px; border: 2.5px solid #161513; border-radius: 12px; overflow: hidden; background: #FFFDF7">
<span style="display: flex; align-items: center; padding: 0 14px; border-right: 1.5px solid #161513; font-weight: 700">+91</span>
<input id="phM" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="{{L.ph}}" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #161513; padding: 0 14px; font-family: inherit; font-size: 1.05em; letter-spacing: 0.04em; outline: none">
</div>
<span style="font-size: 0.8em; color: #3A3631">{{L.hint}}</span>
</div>

<a href="Otp.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700; line-height: 1.3">{{L.cta}}<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>

<div style="margin-top: auto; display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: end">
<svg aria-hidden="true" width="92" height="76" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbM)"><path d="M10 30h34l6-10h28l6 10h26v58H10z"></path><path d="M10 44h100"></path><path d="M26 30V14h56" stroke="#0F5A43"></path></g></svg>
<span style="font-size: 0.8em">{{L.safe}}</span>
</div>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 6px 8px; box-sizing: border-box; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px; line-height: 1.3; text-align: center">{{L.call}}</a>
<button style="min-height: 56px; padding: 6px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px; line-height: 1.3">{{L.callback}}</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["en","te","hi"],"default":"en"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const loc = s.loc || this.props.locale || 'en';
    const D = {
      en: { code: 'en', aa: 'Change text size', choose: 'Language', big: 'Your file at the lab.', sub: 'Every report we make for you is kept here, page by page.', label: 'Your mobile number', ph: '10-digit number', hint: 'The one you gave at the lab counter.', cta: 'Send me a code', safe: 'No password to remember. Only this number opens your file, and we write down every time it is opened.', call: 'Call the lab', callback: 'Call me back' },
      te: { code: 'te', aa: 'అక్షరాల పరిమాణం మార్చండి', choose: 'భాష', big: 'ల్యాబ్‌లో మీ ఫైల్.', sub: 'మీ కోసం తయారైన ప్రతి రిపోర్టు ఇక్కడ, పేజీ పేజీగా ఉంటుంది.', label: 'మీ మొబైల్ నంబర్', ph: '10 అంకెల నంబర్', hint: 'ల్యాబ్ కౌంటర్‌లో ఇచ్చిన నంబర్.', cta: 'నాకు కోడ్ పంపండి', safe: 'పాస్‌వర్డ్ అవసరం లేదు. ఈ నంబర్‌కు మాత్రమే మీ ఫైల్ తెరుచుకుంటుంది. ప్రతిసారి తెరిచినప్పుడు నమోదు చేస్తాము.', call: 'ల్యాబ్‌కు కాల్ చేయండి', callback: 'నాకు తిరిగి కాల్ చేయండి' },
      hi: { code: 'hi', aa: 'अक्षर का आकार बदलें', choose: 'भाषा', big: 'लैब में आपकी फ़ाइल।', sub: 'आपकी हर रिपोर्ट यहाँ, पन्ना-पन्ना रखी जाती है।', label: 'आपका मोबाइल नंबर', ph: '10 अंकों का नंबर', hint: 'जो लैब काउंटर पर दिया था।', cta: 'मुझे कोड भेजें', safe: 'कोई पासवर्ड नहीं। आपकी फ़ाइल सिर्फ़ इसी नंबर पर खुलती है, और हर बार खुलने पर हम दर्ज करते हैं।', call: 'लैब को कॉल करें', callback: 'मुझे वापस कॉल करें' }
    };
    const L = D[loc] || D.en;
    const fonts = { en: "'Atkinson Hyperlegible Next', sans-serif", te: "'Noto Sans Telugu', sans-serif", hi: "'Noto Sans Devanagari', sans-serif" };
    const tints = { en: '#D7E3EE', te: '#F1D9DC', hi: '#F4E9C6' };
    const langs = [['en', 'English'], ['te', 'తెలుగు'], ['hi', 'हिन्दी']].map(([code, label]) => ({
      code, label, font: fonts[code], sel: loc === code ? 'true' : 'false',
      bg: loc === code ? '#FAF6EE' : tints[code], bb: loc === code ? '#FAF6EE' : '#161513', mt: loc === code ? '0' : '8px',
      pick: () => this.setState({ loc: code })
    }));
    const big = !!s.big;
    return { L, langs, fs: big ? 22 : 19, lh: loc === 'en' ? 1.5 : 1.7, hlh: loc === 'en' ? 1.0 : 1.35, bigSize: loc === 'en' ? '58px' : '42px', toggleSize: () => this.setState({ big: !big }) };
  }
}
</script>
</body>
</html>
