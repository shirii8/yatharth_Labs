<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 900px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 20px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grN"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grN)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbN"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.4"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-variant: small-caps; letter-spacing: 0.04em">[Lab name]</span>
<button aria-label="Change text size" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px">Aa</button>
</header>

<div style="position: relative; z-index: 2; display: flex; padding: 0 10px; margin-bottom: -2.5px">
<span style="min-height: 52px; padding: 0 18px; display: flex; align-items: center; border: 2.5px solid #161513; border-bottom-color: {{n.tint}}; border-radius: 12px 12px 0 0; background: {{n.tint}}; font-size: 15px; font-weight: 700">{{n.kicker}}</span>
</div>

<main role="{{n.role}}" style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 34px 22px 26px; background: {{n.tint}}; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px {{n.tint}}, inset 0 0 0 7.5px #161513">
<svg aria-hidden="true" width="150" height="120" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbN)"><path d="{{n.d}}"></path><path d="{{n.g}}" stroke="#0F5A43" stroke-width="2.4"></path></g></svg>
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.02em">{{n.head}}</h1>
<p style="margin: 0">{{n.body}}</p>
<sc-if value="{{n.skeleton}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1.5px dashed #161513">
<span style="width: 45%; height: 12px; border-radius: 6px; background: #CFC5AF"></span>
<span style="width: 85%; height: 26px; border-radius: 6px; background: #CFC5AF"></span>
<span style="width: 60%; height: 12px; border-radius: 6px; background: #CFC5AF"></span>
</div>
</sc-if>
<sc-if value="{{n.hasPrimary}}" hint-placeholder-val="{{ true }}">
<a href="{{n.href}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700">{{n.primary}}<span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</sc-if>
<sc-if value="{{n.hasSecondary}}" hint-placeholder-val="{{ false }}">
<a href="Who.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 2px solid #161513; color: #161513; text-decoration: none; font-weight: 700">{{n.secondary}}</a>
</sc-if>
<p style="margin: auto 0 0; padding-top: 14px; border-top: 1px solid #161513; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 0.95em">{{n.note}}</p>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px">Call the lab</a>
<button style="min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px">Call me back</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["expired","invalid","timeout","loading","empty","error"],"default":"expired"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const folder = 'M10 30h34l6-10h28l6 10h26v58H10z';
    const K = {
      expired: { kicker: 'Filed away', tint: '#F4E9C6', d: folder + 'M60 30v58', g: 'M44 54q16 10 32 0M44 64q16-10 32 0', head: 'We tied this page up for you.', body: 'After 3 days we put each page away so no one who finds your phone can read it. It is safe in your file. A new code unties it.', primary: 'Send me a new code', href: 'Main.dc.html', note: 'It takes less than a minute. — the front desk' },
      invalid: { kicker: 'Torn tab', tint: '#E2DCEC', d: 'M14 40h30l4-8 4 6 4-8 4 8h46v48H14z', g: 'M44 40l4-8 4 6 4-8 4 8', head: 'This link has lost a piece.', body: 'Part of it may have been cut off in the message. Sign in with your number and you will reach the same file.', primary: 'Sign in with my number', href: 'Main.dc.html', note: 'Did not expect a message from us? Please do not share the link, and call us.' },
      timeout: { kicker: 'You stepped away', tint: '#D7E3EE', d: 'M30 10h50v80H30zM80 10l20 8v66l-20 6M70 52h.1M10 90h100', g: 'M80 18l20 2v62l-20 2', head: 'We closed the door behind you.', body: 'After 15 quiet minutes we close your file so no one else sees it. Your place is kept for when you come back.', primary: 'Come back in', href: 'Otp.dc.html', note: 'A fresh code arrives by SMS. — the front desk' },
      loading: { kicker: 'One moment', tint: '#FAF6EE', d: folder + 'M10 46h100', g: 'M30 46V18h60v28M40 28h30', head: 'Taking your page out of the file…', body: 'On slow internet this can take up to a minute. You do not need to do anything.', skeleton: true, note: 'Our pages are small on purpose, so they still arrive on 3G.' },
      empty: { kicker: 'Nothing new', tint: '#DCE7D6', d: folder + 'M10 46h100', g: 'M44 64q16 8 32 0', head: 'Your file is quiet.', body: 'When a test is ready and signed, we will send you an SMS with a link straight to the new page.', secondary: 'Back to the family', note: 'No need to keep checking. We will come to you. — the front desk' },
      error: { kicker: 'Lights out', tint: '#F6E8E6', d: 'M44 14h32l14 30H30zM60 44v30M46 88h28M52 74h16', g: 'M36 56l-8 6M84 56l8 6', head: 'Our lamp is out for a moment.', body: 'Your file is safe. Our side is slow right now. Please try again in a minute or two.', primary: 'Try again', href: 'Reports.dc.html', note: 'If you call us, say code R-502 and we will know what happened.' }
    };
    const kind = this.props.kind || 'expired';
    const n = K[kind] || K.expired;
    return { n: { ...n, skeleton: !!n.skeleton, hasPrimary: !!n.primary, hasSecondary: !!n.secondary, role: kind === 'error' ? 'alert' : 'main' } };
  }
}
</script>
</body>
</html>
