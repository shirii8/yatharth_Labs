<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Something looks wrong</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Noto+Sans+Telugu:wght@400;600&amp;family=Noto+Serif+Telugu:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div lang="{{loc}}" style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans Telugu', system-ui, sans-serif; font-size: 20px; line-height: {{lh}}; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grF"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grF)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbF"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<a href="Report.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 50px; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>{{L.cancel}}</a>
<span style="font-size: 16px">{{L.flagFor}}</span>
</header>

<ol aria-label="Steps" style="position: relative; z-index: 2; display: flex; gap: 4px; margin: 0 0 -2.5px; padding: 0 8px; list-style: none">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<li aria-current="{{t.cur}}" style="flex: 1; min-height: {{t.h}}; margin-top: {{t.mt}}; display: flex; align-items: center; justify-content: center; gap: 4px; border: 2.5px solid #161513; border-bottom-color: {{t.bb}}; border-radius: 12px 12px 0 0; background: {{t.bg}}; font-family: 'Newsreader', Georgia, serif; font-size: 21px">{{t.label}}</li>
</sc-for>
</ol>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 30px 22px 26px; background: #FAF6EE; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #FAF6EE, inset 0 0 0 7.5px #161513">

<sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-weight: 500; font-size: {{bigSize}}; line-height: {{hlh}}; letter-spacing: -0.02em">{{L.t1}}</h1>
<p style="margin: -4px 0 0; font-size: 0.9em">{{L.s1}}</p>
<div role="radiogroup" aria-label="{{L.t1}}" style="display: flex; flex-direction: column; border-top: 2.5px solid #161513">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 4px; border: 0; border-bottom: 1px solid #B9B2A5; background: {{o.bg}}; color: #161513; font-family: inherit; font-size: 0.92em; line-height: 1.35; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; border: 2.5px solid {{o.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{o.dot}}"></span></span>{{o.label}}</button>
</sc-for>
</div>
<button onClick="{{goNext}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 8px 10px 8px 20px; border-radius: 12px; border: 0; background: #0F5A43; color: #FAF6EE; font-family: inherit; font-size: 1em; font-weight: 700; line-height: 1.3; cursor: pointer">{{L.next}}<span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></button>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-weight: 500; font-size: {{bigSize}}; line-height: {{hlh}}; letter-spacing: -0.02em">{{L.t2}}</h1>
<p style="margin: 0; padding: 10px 0; border-top: 2.5px solid #161513; border-bottom: 1px solid #B9B2A5; font-size: 0.88em"><span>{{L.youChose}}</span> <strong>{{chosen}}</strong></p>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 700">{{L.more}}<span style="font-weight: 400; font-size: 0.82em">{{L.optional}}</span>
<textarea rows="4" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 10px; border: 2.5px solid #161513; background: #FFFDF7; color: #161513; font-family: inherit; font-size: 0.95em; line-height: 1.5">{{L.sample}}</textarea>
</label>
<p style="margin: 0; font-size: 0.88em">{{L.callNote}}</p>
<div style="display: grid; grid-template-columns: 1fr 1.7fr; gap: 8px">
<button onClick="{{goBack}}" style="min-height: 60px; padding: 6px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-size: 0.88em; font-weight: 700; line-height: 1.3; cursor: pointer">{{L.back}}</button>
<button onClick="{{goNext}}" style="min-height: 60px; padding: 6px 8px; border-radius: 12px; border: 0; background: #0F5A43; color: #FAF6EE; font-family: inherit; font-size: 0.88em; font-weight: 700; line-height: 1.3; cursor: pointer">{{L.send}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<svg aria-hidden="true" width="120" height="96" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbF)"><path d="M10 30h34l6-10h28l6 10h26v58H10zM24 50h50M24 62h40M24 74h30"></path><path d="M78 74l8 8 20-24" stroke="#0F5A43" stroke-width="2.6"></path></g></svg>
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-weight: 500; font-size: {{bigSize}}; line-height: {{hlh}}; letter-spacing: -0.02em">{{L.t3}}</h1>
<p style="margin: 0">{{L.s3}}</p>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 2.5px solid #161513; border-bottom: 1px solid #B9B2A5"><span style="font-size: 0.85em">{{L.ref}}</span><span style="font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1">F-2041</span></div>
<a href="Report.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; padding: 6px 12px; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700; line-height: 1.3; text-align: center">{{L.backReport}}</a>
<p style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-style: italic">{{L.sign}}</p>
</div>
</sc-if>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 4px 8px; box-sizing: border-box; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px; line-height: 1.3; text-align: center">{{L.call}}</a>
<button style="min-height: 56px; padding: 4px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px; line-height: 1.3">{{L.callback}}</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["1","2","3"],"default":"1"},"locale":{"editor":"enum","options":["en","te"],"default":"en"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const loc = this.props.locale || 'en';
    const step = st.step || Number(this.props.step || 1);
    const D = {
      en: { cancel: 'Cancel', flagFor: 'Blood count', t1: 'What looks wrong?', s1: 'Pick one. A person at the lab reads every one of these.', opts: ['This is not my report', 'The name or age is wrong', 'A value looks different from what I expected', 'Something else'], next: 'Next', t2: 'Tell us a little more.', youChose: 'You picked:', more: 'Anything that would help us check', optional: 'You can skip this.', sample: 'My haemoglobin was 12.4 at another lab last month.', callNote: 'We will ring you back on •3210.', back: 'Back', send: 'Send it to the lab', t3: 'Thank you. It is in your file now.', s3: 'Someone at the lab will check your report and call you by 6 pm today. Nothing on it changes until a doctor has looked.', ref: 'Your reference', backReport: 'Back to my report', sign: 'We are glad you told us. — the front desk', call: 'Call the lab', callback: 'Call me back' },
      te: { cancel: 'రద్దు', flagFor: 'రక్త పరీక్ష', t1: 'ఏమి తప్పుగా అనిపిస్తోంది?', s1: 'ఒకటి ఎంచుకోండి. ల్యాబ్‌లో ఒక వ్యక్తి ప్రతిదాన్నీ చదువుతారు.', opts: ['ఇది నా రిపోర్టు కాదు', 'పేరు లేదా వయసు తప్పుగా ఉంది', 'ఒక విలువ నేను అనుకున్నదానికి భిన్నంగా ఉంది', 'ఇంకేదైనా'], next: 'తరువాత', t2: 'కొంచెం ఎక్కువ చెప్పండి.', youChose: 'మీరు ఎంచుకున్నది:', more: 'సరిచూడటానికి సహాయపడే ఏదైనా', optional: 'దీన్ని దాటవేయవచ్చు.', sample: '', callNote: 'మేము •3210 నంబర్‌కు తిరిగి కాల్ చేస్తాము.', back: 'వెనుకకు', send: 'ల్యాబ్‌కు పంపండి', t3: 'ధన్యవాదాలు. ఇది మీ ఫైల్‌లో నమోదైంది.', s3: 'ల్యాబ్‌లో ఒకరు మీ రిపోర్టును పరిశీలించి, ఈ రోజు సాయంత్రం 6 లోపు కాల్ చేస్తారు.', ref: 'సూచన సంఖ్య', backReport: 'నా రిపోర్టుకు తిరిగి', sign: 'చెప్పినందుకు సంతోషం. — ఫ్రంట్ డెస్క్', call: 'ల్యాబ్‌కు కాల్ చేయండి', callback: 'నాకు తిరిగి కాల్ చేయండి' }
    };
    const L = D[loc] || D.en;
    const pick = st.pick ?? 2;
    const opts = L.opts.map((label, i) => ({
      label, checked: pick === i ? 'true' : 'false', dot: pick === i ? '#0F5A43' : 'transparent', ring: pick === i ? '#0F5A43' : '#161513',
      bg: pick === i ? '#E4EEE8' : 'transparent', pick: () => this.setState({ pick: i, step })
    }));
    const tints = ['#D7E3EE', '#DCE7D6', '#F4E9C6'];
    const tabs = [1, 2, 3].map(n => ({ label: n < step ? '✓ ' + n : String(n), cur: n === step ? 'step' : 'false', bg: n === step ? '#FAF6EE' : tints[n - 1], bb: n === step ? '#FAF6EE' : '#161513', h: n === step ? '56px' : '48px', mt: n === step ? '0' : '8px' }));
    const te = loc !== 'en';
    return {
      L, loc, opts, tabs, chosen: L.opts[pick], s1: step === 1, s2: step === 2, s3: step === 3,
      lh: te ? 1.65 : 1.5, hlh: te ? 1.35 : 1.0, bigSize: te ? '34px' : '48px',
      goNext: () => this.setState({ step: Math.min(3, step + 1), pick }),
      goBack: () => this.setState({ step: Math.max(1, step - 1), pick })
    };
  }
}
</script>
</body>
</html>
