<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Please call us</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Noto+Sans+Telugu:wght@400;600&amp;family=Noto+Serif+Telugu:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div lang="{{loc}}" style="position: relative; width: 390px; min-height: 1500px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', 'Noto Sans Telugu', system-ui, sans-serif; font-size: 20px; line-height: {{lh}}; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grCr"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grCr)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbCr"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-variant: small-caps; letter-spacing: 0.04em">[Lab name]</span>
<button aria-label="Change text size" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px">Aa</button>
</header>

<nav aria-label="Family" style="position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 8px; margin-bottom: -2.5px">
<a href="Reports.dc.html" style="flex: 1; min-height: 48px; margin-top: 8px; display: flex; align-items: center; justify-content: center; border: 2.5px solid #161513; border-radius: 12px 12px 0 0; background: #D7E3EE; color: #161513; text-decoration: none; font-size: 16px; font-weight: 700">{{L.t1}}</a>
<span aria-current="page" style="flex: 1.2; min-height: 56px; display: flex; align-items: center; justify-content: center; border: 2.5px solid #161513; border-bottom-color: #F6E8E6; border-radius: 12px 12px 0 0; background: #F6E8E6; font-size: 16px; font-weight: 700">{{L.t2}}</span>
<a href="Who.dc.html" style="flex: 1; min-height: 48px; margin-top: 8px; display: flex; align-items: center; justify-content: center; border: 2.5px solid #161513; border-radius: 12px 12px 0 0; background: #F4E9C6; color: #161513; text-decoration: none; font-size: 16px; font-weight: 700">{{L.t3}}</a>
</nav>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 30px 22px 26px; background: #F6E8E6; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px #F6E8E6, inset 0 0 0 7.5px #161513">
<svg aria-hidden="true" width="128" height="100" viewBox="0 0 120 96" fill="none" stroke="#161513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g filter="url(#wbCr)"><path d="M22 84h76l-8-26H30zM53 71a7 7 0 1 0 14 0a7 7 0 1 0-14 0M18 42q0-14 14-14h56q14 0 14 14l-12 6q-4-10-30-10t-30 10z"></path><path d="M102 42q14 10 6 26t-14 18" stroke="#0F5A43" stroke-width="2.4"></path></g></svg>
<h1 style="margin: 0; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-weight: 500; font-size: {{bigSize}}; line-height: {{hlh}}; letter-spacing: -0.02em">{{L.head}}</h1>
<p style="margin: 0">{{L.body}}</p>
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700; line-height: 1.3">{{L.cta}}<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg></span></a>

<svg aria-hidden="true" width="100%" height="14" viewBox="0 0 330 14" preserveAspectRatio="none"><path d="M1 12H150Q154 12 156 3H184Q186 12 190 12H329" fill="none" stroke="#161513" stroke-width="1.6" stroke-linecap="round" filter="url(#wbCr)"></path></svg>
<h2 style="margin: 0; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">{{L.nextHead}}</h2>
<ol style="margin: -6px 0 0; padding: 0; list-style: none">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<li style="display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid #C9B8B4">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{s.ring}}; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'Newsreader', Georgia, serif; font-size: 17px">{{s.mark}}</span>
<span style="display: flex; flex-direction: column"><strong style="font-size: 0.9em; line-height: 1.35">{{s.t}}</strong><span style="font-size: 0.8em">{{s.sub}}</span></span>
</li>
</sc-for>
</ol>

<section aria-label="Safety note" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 2px solid #161513; background: #FAF6EE">
<strong style="font-size: 0.9em; line-height: 1.4">{{L.safetyHead}}</strong>
<ul style="margin: 0; padding-left: 22px; font-size: 0.88em">
<sc-for list="{{L.items}}" as="it" hint-placeholder-count="4"><li>{{it.t}}</li></sc-for>
</ul>
<span style="padding-top: 6px; border-top: 1px solid #B9B2A5; font-family: 'Newsreader', 'Noto Serif Telugu', Georgia, serif; font-style: italic; font-size: 0.72em">{{L.approved}}</span>
</section>
<a href="#full" style="display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 4px 10px; border-radius: 12px; border: 2px solid #161513; color: #161513; text-decoration: none; font-weight: 700; font-size: 0.85em; line-height: 1.3; text-align: center">{{L.full}}</a>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 4px 8px; box-sizing: border-box; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px; line-height: 1.3; text-align: center">{{L.call}}</a>
<button style="min-height: 56px; padding: 4px 8px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px; line-height: 1.3">{{L.callback}}</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["en","te"],"default":"en"},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const loc = this.props.locale || 'en';
    const D = {
      en: { t1: 'Lakshmi', t2: 'Ramana', t3: 'Anjali', head: 'Please call us about Ramana garu’s report.', body: 'One result needs a doctor to talk it through with you today. We kept the explanation for that call, so you are not left reading it alone.', cta: 'Call the lab now', nextHead: 'What happens now',
        steps: [['We have asked our team to call you.', 'Asked at 10:41 am'], ['Someone from the lab will ring within 30 minutes.', 'Keep this phone close'], ['A doctor will explain and plan the next steps with you.', 'You will not have to decide alone']],
        safetyHead: 'Go to the nearest hospital emergency now if he has any of these:', items: [{ t: 'Chest pain' }, { t: 'A fast or uneven heartbeat' }, { t: 'Sudden weakness in the arms or legs' }, { t: 'Trouble breathing' }],
        approved: 'Safety note approved by [LAB DOCTOR NAME], lab doctor. The same words appear on every page like this.', full: 'Full signed report, for the doctor', call: 'Call the lab', callback: 'Call me back' },
      te: { t1: 'లక్ష్మి', t2: 'రమణ', t3: 'అంజలి', head: 'రమణ గారి రిపోర్టు గురించి దయచేసి మాకు కాల్ చేయండి.', body: 'ఒక ఫలితం గురించి ఈ రోజే డాక్టర్ మీతో మాట్లాడాలి. వివరణను ఆ కాల్ కోసం ఉంచాము, మీరు ఒంటరిగా చదవనక్కర్లేదు.', cta: 'ఇప్పుడే ల్యాబ్‌కు కాల్ చేయండి', nextHead: 'ఇప్పుడు ఏమి జరుగుతుంది',
        steps: [['మీకు కాల్ చేయమని మా బృందానికి చెప్పాము.', 'ఉదయం 10:41కి'], ['30 నిమిషాల్లో ల్యాబ్ నుండి కాల్ వస్తుంది.', 'ఫోన్ దగ్గర ఉంచుకోండి'], ['డాక్టర్ వివరించి, తదుపరి చర్యలు మీతో నిర్ణయిస్తారు.', 'మీరు ఒంటరిగా నిర్ణయించనక్కర్లేదు']],
        safetyHead: 'ఆయనకు వీటిలో ఏదైనా ఉంటే, వెంటనే దగ్గరలోని ఆసుపత్రి అత్యవసర విభాగానికి వెళ్ళండి:', items: [{ t: 'ఛాతీ నొప్పి' }, { t: 'వేగంగా లేదా అసమానంగా గుండె కొట్టుకోవడం' }, { t: 'చేతులు లేదా కాళ్ళలో అకస్మాత్తుగా బలహీనత' }, { t: 'శ్వాస తీసుకోవడంలో ఇబ్బంది' }],
        approved: 'ల్యాబ్ డాక్టర్ [ల్యాబ్ డాక్టర్ పేరు] ఆమోదించిన భద్రతా సూచన.', full: 'సంతకం చేసిన పూర్తి రిపోర్టు', call: 'ల్యాబ్‌కు కాల్ చేయండి', callback: 'నాకు తిరిగి కాల్ చేయండి' }
    };
    const L = D[loc] || D.en;
    const steps = L.steps.map(([t, sub], i) => ({ t, sub, mark: i === 0 ? '✓' : String(i + 1), bg: i === 0 ? '#0F5A43' : 'transparent', fg: i === 0 ? '#FAF6EE' : '#161513', ring: i === 0 ? '#0F5A43' : '#161513' }));
    const te = loc !== 'en';
    return { L, loc, steps, lh: te ? 1.65 : 1.5, hlh: te ? 1.35 : 1.02, bigSize: te ? '32px' : '44px' };
  }
}
</script>
</body>
</html>
