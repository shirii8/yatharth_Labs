<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whose file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 10px 12px; background: #DCD2BD; color: #161513; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 19px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
<svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14"><filter id="grW"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grW)"></rect></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="wbW"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"></feDisplacementMap></filter></svg>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 12px 4px">
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-variant: small-caps; letter-spacing: 0.04em">[Lab name]</span>
<button aria-label="Change text size" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: 'Newsreader', Georgia, serif; font-size: 21px">Aa</button>
</header>
<p style="position: relative; margin: 0 4px 12px; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 22px; line-height: 1.25">Three files are kept at this number. Whose shall we open?</p>

<div role="tablist" aria-label="Family" style="position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 8px; margin-bottom: -2.5px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="3">
<button role="tab" aria-selected="{{p.sel}}" aria-label="{{p.aria}}" onClick="{{p.pick}}" style="flex: 1; min-height: {{p.h}}; margin-top: {{p.mt}}; display: flex; align-items: center; justify-content: center; gap: 6px; border: 2.5px solid #161513; border-bottom-color: {{p.bb}}; border-radius: 12px 12px 0 0; background: {{p.tint}}; color: #161513; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{p.first}}<sc-if value="{{p.dot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #8A3B26"></span></sc-if></button>
</sc-for>
</div>

<main role="tabpanel" style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 32px 22px 26px; background: {{cur.tint}}; border: 2.5px solid #161513; box-shadow: inset 0 0 0 6px {{cur.tint}}, inset 0 0 0 7.5px #161513">
<span style="font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase">{{cur.meta}}</span>
<h1 style="margin: -6px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 64px; line-height: 0.95; letter-spacing: -0.03em">{{cur.name}}</h1>
<svg aria-hidden="true" width="100%" height="14" viewBox="0 0 330 14" preserveAspectRatio="none"><path d="M1 12H150Q154 12 156 3H184Q186 12 190 12H329" fill="none" stroke="#161513" stroke-width="1.6" stroke-linecap="round" filter="url(#wbW)"></path></svg>
<p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 26px; line-height: 1.2">{{cur.status}}</p>
<p style="margin: 0; font-size: 0.9em">{{cur.detail}}</p>
<a href="{{cur.href}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 8px 10px 8px 20px; box-sizing: border-box; border-radius: 12px; background: #0F5A43; color: #FAF6EE; text-decoration: none; font-weight: 700">{{cur.cta}}<span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #FAF6EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid #161513; font-size: 0.85em">
<span>Someone missing? The front desk can add them to this number.</span>
<a href="Data.dc.html" style="color: #161513; font-weight: 700; min-height: 44px; display: flex; align-items: center">Your data and choices</a>
</div>
</main>

<footer style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-top: 10px">
<a href="tel:+910000000000" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; text-decoration: none; font-weight: 700; font-size: 17px">Call the lab</a>
<button style="min-height: 56px; border-radius: 12px; border: 2px solid #161513; background: #FAF6EE; color: #161513; font-family: inherit; font-weight: 700; font-size: 17px">Call me back</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state && this.state.pick) ?? 0;
    const P = [
      { first: 'Lakshmi', name: 'Lakshmi Devi', meta: 'You · 64', tint: '#D7E3EE', status: 'A new page is waiting for you.', detail: 'Your blood count was signed this morning. Your thyroid test is still with the doctor.', cta: 'Open my file', href: 'Reports.dc.html', aria: 'Lakshmi Devi, you, a new page' },
      { first: 'Ramana', name: 'Ramana Rao', meta: 'Husband · 69', tint: '#F6E8E6', status: 'There is a page we would like to talk to you about.', detail: 'Please open it, or simply call us. We have already asked our team to ring you.', cta: 'Open Ramana garu’s file', href: 'Critical.dc.html', dot: true, aria: 'Ramana Rao, please call us' },
      { first: 'Anjali', name: 'Anjali', meta: 'Daughter · 34', tint: '#F4E9C6', status: 'Nothing new since September.', detail: 'Her last page, a vitamin check, is still in her file.', cta: 'Open Anjali’s file', href: 'Reports.dc.html', aria: 'Anjali, nothing new' }
    ];
    const people = P.map((p, i) => ({ ...p, dot: !!p.dot, sel: pick === i ? 'true' : 'false', h: pick === i ? '56px' : '48px', mt: pick === i ? '0' : '8px', bb: pick === i ? p.tint : '#161513', pick: () => this.setState({ pick: i }) }));
    return { people, cur: P[pick] };
  }
}
</script>
</body>
</html>
