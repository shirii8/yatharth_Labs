# Local development database only. Production uses Supabase (Mumbai region).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yatharth
      POSTGRES_PASSWORD: yatharth_local_only
      POSTGRES_DB: yatharth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
